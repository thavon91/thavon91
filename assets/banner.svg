<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Thavon's Build Play Learn Repeat banner</title>
  <desc id="desc">A warm illustrated mountain lake at sunset with a creative developer message.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19253f"/>
      <stop offset="0.52" stop-color="#d77668"/>
      <stop offset="1" stop-color="#f6c779"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#39536a"/>
      <stop offset="1" stop-color="#111a29"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263d51"/>
      <stop offset="1" stop-color="#0b1723"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="760" rx="22" fill="#0c1524"/>
  <rect x="8" y="8" width="1584" height="744" rx="18" fill="url(#sky)" stroke="#52647c" stroke-width="4"/>
  <rect x="8" y="8" width="850" height="744" rx="18" fill="#07111f" opacity=".84"/>
  <circle cx="1280" cy="300" r="92" fill="#ffe09a" opacity=".75" filter="url(#glow)"/>
  <circle cx="1280" cy="300" r="58" fill="#ffe6a8"/>
  <path d="M700 390 850 230 1010 370 1180 170 1330 350 1480 220 1600 320V520H700Z" fill="#36425b" opacity=".82"/>
  <path d="M620 440 820 250 970 390 1160 220 1320 400 1480 260 1600 360V540H620Z" fill="url(#hill)"/>
  <path d="M570 445 Q960 390 1240 455 T1600 430 V760H570Z" fill="url(#water)"/>
  <path d="M570 510 Q940 460 1230 515 T1600 500" fill="none" stroke="#7793a0" stroke-width="5" opacity=".45"/>
  <path d="M780 570 Q1030 530 1300 575 T1600 560" fill="none" stroke="#d1a879" stroke-width="4" opacity=".46"/>
  <path d="M520 700 Q780 590 1050 700 T1600 655V760H520Z" fill="#101b20"/>
  <path d="M1320 760 1370 570 1400 690 1450 520 1490 680 1540 580 1600 760Z" fill="#101b20"/>
  <g fill="#f4d49a" opacity=".9">
    <circle cx="1120" cy="620" r="4"/><circle cx="1181" cy="597" r="3"/><circle cx="1515" cy="594" r="4"/>
  </g>
  <g fill="#f7f8fb" font-family="monospace">
    <text x="72" y="112" font-size="58" font-weight="bold">Hi there, I'm Thavon</text>
    <text x="72" y="172" font-size="31" fill="#b9c9df">Game Developer | 3D Artist | AI Explorer</text>
    <text x="72" y="245" font-size="23" fill="#dce6f4">I'm passionate about creating games, interactive media,</text>
    <text x="72" y="280" font-size="23" fill="#dce6f4">and useful tools. I love turning ideas into real projects.</text>
    <text x="98" y="370" font-size="29" font-weight="bold" fill="#8ed8ff">[ GAME DEVELOPMENT ]</text>
    <text x="98" y="408" font-size="22" fill="#dce6f4">Unreal Engine | Blender | Three.js</text>
    <text x="98" y="490" font-size="29" font-weight="bold" fill="#78e0b2">[ WEB DEVELOPMENT ]</text>
    <text x="98" y="528" font-size="22" fill="#dce6f4">React | Supabase | Node.js</text>
    <text x="98" y="610" font-size="29" font-weight="bold" fill="#7de8ef">[ AI &amp; TOOLS ]</text>
    <text x="98" y="648" font-size="22" fill="#dce6f4">Open Source | LLMs | Automation</text>
  </g>
  <g fill="#fff4d1" font-family="Georgia, serif" text-anchor="middle" font-size="50" font-style="italic">
    <text x="1370" y="125">Build</text><text x="1370" y="180">Play</text><text x="1370" y="235">Learn</text><text x="1370" y="290">Repeat</text>
  </g>
  <path d="M1250 330 Q1360 280 1480 245" fill="none" stroke="#fff4d1" stroke-width="5" stroke-linecap="round"/>
  <text x="1370" y="625" fill="#f6d6a0" font-family="Georgia, serif" font-size="24" font-style="italic" text-anchor="middle">Small steps every day</text>
  <text x="1370" y="657" fill="#f6d6a0" font-family="Georgia, serif" font-size="24" font-style="italic" text-anchor="middle">create big results.</text>
</svg>
