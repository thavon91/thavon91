      <stop offset="1" stop-color="#0b1723"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="520" fill="url(#sky)"/>
  <circle cx="1130" cy="164" r="74" fill="#ffe09a" opacity=".75" filter="url(#glow)"/>
  <circle cx="1130" cy="164" r="48" fill="#ffe6a8"/>
  <path d="M0 265 170 130 290 235 440 82 610 240 790 105 940 235 1130 62 1320 230 1480 116 1600 220V360H0Z" fill="#36425b" opacity=".82"/>
  <path d="M0 300 185 160 300 258 470 130 620 275 805 160 940 275 1130 108 1300 270 1480 145 1600 255V380H0Z" fill="url(#hill)"/>
  <path d="M0 310 Q390 270 800 325 T1600 300 V520H0Z" fill="url(#water)"/>
  <path d="M0 350 Q350 320 720 362 T1600 342" fill="none" stroke="#7793a0" stroke-width="4" opacity=".45"/>
  <path d="M250 390 Q515 355 760 398 T1280 388" fill="none" stroke="#d1a879" stroke-width="3" opacity=".46"/>
  <path d="M0 455 Q180 395 360 462 T740 448 T1100 452 T1600 425V520H0Z" fill="#101b20"/>
  <path d="M1260 520 1310 392 1340 466 1380 360 1422 470 1488 405 1600 520Z" fill="#101b20"/>
  <g fill="#f4d49a" opacity=".9">
